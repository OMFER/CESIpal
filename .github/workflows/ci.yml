name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  api:
    runs-on: ubuntu-latest

    # Base de datos desechable para las pruebas e2e
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - name: Linter (incluye la regla de capas)
        run: npm run lint:ci
      - name: Tipos
        run: npm run typecheck
      - name: Pruebas unitarias
        run: npm test
      - name: Build
        run: npm run build
      - name: Pruebas e2e
        run: npm run test:e2e
        env:
          MONGO_URI_E2E: mongodb://localhost:27017/cesipal_e2e
